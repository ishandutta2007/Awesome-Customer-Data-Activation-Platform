<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f1538" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#ec4899;#8b5cf6;#3b82f6;#6366f1" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#8b5cf6;#3b82f6;#6366f1;#ec4899" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#3b82f6;#6366f1;#ec4899;#8b5cf6" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200 M0,320 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M40,0 V360 M80,0 V360 M120,0 V360 M160,0 V360 M200,0 V360 M240,0 V360 M280,0 V360 M320,0 V360 M360,0 V360 M400,0 V360 M440,0 V360 M480,0 V360 M520,0 V360 M560,0 V360 M600,0 V360 M640,0 V360 M680,0 V360 M720,0 V360 M760,0 V360 M800,0 V360 M840,0 V360 M880,0 V360 M920,0 V360 M960,0 V360 M1000,0 V360 M1040,0 V360 M1080,0 V360 M1120,0 V360 M1160,0 V360" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Glowing Animated Top Border -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#glowGrad)" />

  <!-- Animated Background Pulse Particles -->
  <circle cx="180" cy="180" r="120" fill="#6366f1" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="100;140;100" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1020" cy="180" r="120" fill="#ec4899" opacity="0.08" filter="url(#glow)">
    <animate attributeName="r" values="140;100;140" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Left: Data Activation Flow Diagram -->
  <!-- Connection Paths -->
  <path d="M 170 180 C 230 180, 230 130, 290 130" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 170 180 C 230 180, 230 230, 290 230" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Warehouse Node -->
  <g transform="translate(70, 140)">
    <rect width="100" height="80" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="50" y="38" text-anchor="middle" font-size="22">🏢</text>
    <text x="50" y="62" text-anchor="middle" class="node-text">Warehouse</text>
  </g>

  <!-- Activation Engine Node -->
  <g transform="translate(290, 140)">
    <rect width="120" height="80" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="stroke" values="#8b5cf6;#ec4899;#3b82f6;#8b5cf6" dur="6s" repeatCount="indefinite" />
    </rect>
    <text x="60" y="38" text-anchor="middle" font-size="22">⚡</text>
    <text x="60" y="62" text-anchor="middle" class="node-text">Reverse ETL</text>
  </g>

  <path d="M 410 180 C 470 180, 470 110, 530 110" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 410 180 C 470 180, 470 180, 530 180" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M 410 180 C 470 180, 470 250, 530 250" fill="none" stroke="url(#wireGrad)" stroke-width="3" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" values="40;0" dur="2s" repeatCount="indefinite" />
  </path>

  <!-- Destination Targets -->
  <g transform="translate(530, 85)">
    <rect width="90" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="45" y="32" text-anchor="middle" class="node-text">📊 CRM / Ads</text>
  </g>
  <g transform="translate(530, 155)">
    <rect width="90" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="45" y="32" text-anchor="middle" class="node-text">✉️ Marketing</text>
  </g>
  <g transform="translate(530, 225)">
    <rect width="90" height="50" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="45" y="32" text-anchor="middle" class="node-text">💬 Support</text>
  </g>

  <!-- Right: Title and Main Copy -->
  <g transform="translate(680, 105)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" class="badge" fill="#c7d2fe">WAREHOUSE-NATIVE STACK</text>

    <!-- Main Title -->
    <text x="0" y="70" class="title">Customer Data</text>
    <text x="0" y="115" class="title" fill="url(#glowGrad)">Activation Platform</text>

    <!-- Subtitle -->
    <text x="0" y="155" class="subtitle">Reverse ETL • Composable CDP • Audience Sync</text>

    <!-- Tags Row -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="52" y="17" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">🚀 SaaS CDPs</text>

      <rect x="115" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="180" y="17" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">⭐ Open Source</text>

      <rect x="255" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="317" y="17" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="sans-serif">🔄 Reverse ETL</text>
    </g>
  </g>
</svg>
